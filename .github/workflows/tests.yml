name: tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "fix/**", "test/**", "release/**", "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ExifTool and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip check
      - name: Report pinned dependency license metadata
        run: python scripts/audit_dependency_licenses.py --lock requirements-dev.lock
      - name: Download pinned RAW integration fixtures
        run: |
          mkdir -p test-data
          curl --fail --location --retry 3 --output test-data/iss030e122639.NEF \
            https://raw.githubusercontent.com/letmaik/rawpy/a39c2e7a44911889c3360891012f862f904ba551/test/iss030e122639.NEF
          curl --fail --location --retry 3 --output test-data/iss042e297200.NEF \
            https://raw.githubusercontent.com/letmaik/rawpy/a39c2e7a44911889c3360891012f862f904ba551/test/iss042e297200.NEF
          curl --fail --location --retry 3 --output test-data/Canon-5D-Mark-IV.CR2 https://github.com/tellodaniel/revelraw-sample-raw-files/releases/download/v1/Canon-5D-Mark-IV.CR2
          echo "02b23f9cc6dc4c99fb39aa4d1f65ac227804d06461ac1bd0f842aa2f3beb8fe4  test-data/Canon-5D-Mark-IV.CR2" | sha256sum -c -
      - name: Compile Python sources and benchmark utility
        run: python -m compileall -q app.py core.py jobs.py video.py scripts tests
      - name: Verify benchmark CLI imports outside repository root
        run: |
          cd /tmp
          python "$GITHUB_WORKSPACE/scripts/benchmark_photo.py" --help
      - name: Run tests
        env:
          PHOTOLUT_TEST_RAW_DIR: test-data
          PHOTOLUT_CONCURRENCY: "1"
        run: pytest -q -rs

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate CPU and NVIDIA Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Build separate photo and video images
        run: |
          docker build --target photo --tag photolut:ci-photo .
          docker build --target video --tag photolut:ci-video .
      - name: Verify photo image excludes FFmpeg and imports the application
        run: |
          docker run --rm photolut:ci-photo sh -ec '! command -v ffmpeg && python -c "import app"'
      - name: Install Playwright browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start video-capable container
        run: docker run --detach --name photolut-ci --publish 127.0.0.1:8000:8000 photolut:ci-video
      - name: Verify container runs unprivileged
        run: test "$(docker exec photolut-ci id -u)" -ne 0
      - name: Smoke-test web UI and API schema
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker logs photolut-ci || true
            docker rm -f photolut-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ --output /tmp/photolut-index.html; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "PhotoLUT did not start or serve its homepage."
            exit 1
          fi

          grep -q '<title>PhotoLUT</title>' /tmp/photolut-index.html
          docker exec photolut-ci ffmpeg -hide_banner -filters 2>&1 | grep 'libplacebo' >/dev/null
          docker exec photolut-ci ffmpeg -hide_banner -h filter=libplacebo 2>&1 | grep -E '^[[:space:]]*lut[[:space:]]+<' >/dev/null
          grep -q 'id="previewCompare"' /tmp/photolut-index.html
          grep -q 'id="videoCompareStage"' /tmp/photolut-index.html
          grep -q 'id="videoCompareSeek"' /tmp/photolut-index.html
          grep -q 'data-studio-mode="photos"' /tmp/photolut-index.html
          grep -q 'data-studio-mode="video"' /tmp/photolut-index.html
          grep -q 'id="videoPreviewPanel"' /tmp/photolut-index.html
          grep -q 'id="videoLutProfile"' /tmp/photolut-index.html
          grep -q 'photolut_sdr_rec709_10bit.mp4' /tmp/photolut-index.html
          grep -q '.shell\[data-mode="video"\] #inputArea' /tmp/photolut-index.html
          ! grep -q 'id="videoCompareSeconds"' /tmp/photolut-index.html
          ! grep -q 'id="preserveHdrBtn"' /tmp/photolut-index.html
          grep -q 'id="intensity"' /tmp/photolut-index.html
          grep -q 'id="downloadPicker"' /tmp/photolut-index.html
          grep -q 'remove-result' /tmp/photolut-index.html
          grep -q 'family=Inter:wght@100..900' /tmp/photolut-index.html
          grep -q 'Process batch' /tmp/photolut-index.html
          curl --fail --silent http://127.0.0.1:8000/luts/photolut-neutral-hlg-bt2020.cube --output /tmp/photolut-neutral-hlg-bt2020.cube
          grep -q 'LUT_3D_SIZE 17' /tmp/photolut-neutral-hlg-bt2020.cube
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class InlineScripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  if tag == 'script' and not dict(attrs).get('src'):
                      self.in_script = True

              def handle_endtag(self, tag):
                  if tag == 'script':
                      self.in_script = False

              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)

          parser = InlineScripts()
          parser.feed(Path('/tmp/photolut-index.html').read_text())
          Path('/tmp/photolut-inline.js').write_text('\\n'.join(parser.parts))
          PY
          node --check /tmp/photolut-inline.js
          python tests/browser_export_smoke.py
          curl --fail --silent http://127.0.0.1:8000/openapi.json |
            python -c 'import json, sys; schema=json.load(sys.stdin); assert "delete" in schema["paths"]["/api/jobs/{job_id}/outputs/{output_id}"]'
          curl --fail --silent http://127.0.0.1:8000/openapi.json |
            python -c 'import json, sys; assert json.load(sys.stdin)["info"]["title"] == "PhotoLUT"'
