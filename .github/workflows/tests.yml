name: tests

on:
  push:
    branches: [main, "fix/**", "test/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ExifTool
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Download pinned RAW integration fixtures
        run: |
          mkdir -p test-data
          curl --fail --location --retry 3 --output test-data/iss030e122639.NEF \
            https://raw.githubusercontent.com/letmaik/rawpy/a39c2e7a44911889c3360891012f862f904ba551/test/iss030e122639.NEF
          curl --fail --location --retry 3 --output test-data/iss042e297200.NEF \
            https://raw.githubusercontent.com/letmaik/rawpy/a39c2e7a44911889c3360891012f862f904ba551/test/iss042e297200.NEF
      - name: Run tests
        env:
          PHOTOLUT_TEST_RAW_DIR: test-data
        run: pytest -q
